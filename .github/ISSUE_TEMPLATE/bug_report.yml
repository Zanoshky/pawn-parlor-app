name: Bug report
description: Something in Pawn Parlor does not work, looks wrong or crashes.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. One problem per report, please.
        Before you attach a screenshot, crop or cover anything private. Issues here are public.
        Never post your password or a payment receipt. For billing questions, use the email on the report page of the guide.
  - type: input
    id: version
    attributes:
      label: App version
      description: "Android settings, Apps, Pawn Parlor. The version is near the bottom of that page."
      placeholder: "1.0"
    validations:
      required: true
  - type: input
    id: phone
    attributes:
      label: Phone model
      description: Android settings, About phone.
      placeholder: Pixel 8
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Android version
      description: Android settings, About phone, Android version.
      placeholder: "15"
    validations:
      required: true
  - type: input
    id: chrome
    attributes:
      label: Chrome version
      description: "Pawn Parlor runs on Chrome. Open Google Play, search Chrome, or Android settings, Apps, Chrome."
      placeholder: "130"
  - type: dropdown
    id: where
    attributes:
      label: "Which screen?"
      options:
        - Home (Continue playing, Quick Match)
        - All games (the library)
        - Game setup, bots and lobby
        - Playing a game (board, hint, rules, concede)
        - Game chat, report and block
        - Daily challenge
        - Live and watching a game
        - Leaderboards
        - My games and replays
        - My record and achievements
        - Player profile and friends
        - The roster (the bots)
        - Pawn Parlor Online (subscribe sheet or card)
        - Sign in, register or reset password
        - Settings
        - Privacy and your data
        - Terms
        - Status
        - other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What you did, one step per line.
      placeholder: |
        1. Open ...
        2. Tap ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead
    validations:
      required: true
  - type: textarea
    id: media
    attributes:
      label: Screenshot or screen recording
      description: Drag the file in here. A short recording helps a lot with board or gesture bugs.
  - type: checkboxes
    id: checks
    attributes:
      label: Before you send
      options:
        - label: I searched the open issues and this is not there yet.
          required: true
        - label: My screenshots show nothing private.
          required: true
