name: Feature request
description: An idea for something Pawn Parlor could do.
title: "[idea] "
labels: ["enhancement"]
body:
  - type: textarea
    id: what
    attributes:
      label: What you want
      description: Describe the feature in a few lines.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: What would it help you do? A real example helps.
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: "Which screen?"
      options:
        - Home (Continue playing, Quick Match)
        - All games (the library)
        - Game setup, bots and lobby
        - Playing a game (board, hint, rules, concede)
        - Game chat, report and block
        - Daily challenge
        - Live and watching a game
        - Leaderboards
        - My games and replays
        - My record and achievements
        - Player profile and friends
        - The roster (the bots)
        - Pawn Parlor Online (subscribe sheet or card)
        - Sign in, register or reset password
        - Settings
        - Privacy and your data
        - Terms
        - Status
        - other
    validations:
      required: true
  - type: textarea
    id: media
    attributes:
      label: Pictures or links
      description: A sketch, a screenshot or a link to something similar.
  - type: checkboxes
    id: checks
    attributes:
      label: Before you send
      options:
        - label: I searched the open issues and this idea is not there yet.
          required: true
